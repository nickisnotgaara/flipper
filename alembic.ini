# Alembic configuration for Flipper.
#
# Migrations live in ./alembic/versions/. The env.py reads DATABASE_URL from
# the environment (same URL used by all services — see .env).
#
# Typical usage:
#   # Generate a migration from model changes:
#   alembic revision --autogenerate -m "add X column to houses"
#
#   # Apply all pending migrations:
#   alembic upgrade head
#
#   # Roll back one migration:
#   alembic downgrade -1
#
#   # Stamp the current DB as being at 'head' WITHOUT running migrations
#   # (use when adopting Alembic on an existing DB — see alembic/README.md):
#   alembic stamp head
#
# N.B. alembic itself does NOT read DATABASE_URL from .env — you must export
# it in the shell or use a tool like direnv. In Docker:
#   docker compose exec app_postgres env | grep DATABASE_URL
#   docker compose run --rm api alembic upgrade head

[alembic]
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template (default is local)
timezone = UTC

# Maximum length of characters to apply to the
# 'slug' field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command
revision_environment = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S