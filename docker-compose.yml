# Flipper — Единая система парсинга недвижимости.
#
# Сервисы:
#   Infrastructure: app_postgres, app_redis, html_to_markdown, cookie_manager
#   Parsers (manual): cian_active, cian_sold, winners_sold, domclick_sold, flatinfo_houses
#                     category_counter, pipeline_runner
#   Always-on:       api (FastAPI prod), scheduler (cron-подобный)
#
# Фронтенд (Next.js) намеренно вынесен из compose.
#   - Собирается отдельно: web/next/ → `npm run build` → статика в ./out
#   - Деплоится на Vercel / Cloudflare Pages / nginx / S3+CDN
#   - При правке фронта Docker-стек не перезапускается
#   - Подробности: web/next/README.md
#
# Запуск:
#   docker compose up -d                                 # инфраструктура + scheduler + api
#   docker compose run --rm cian_active                  # ручной запуск парсера
#   docker compose run --rm cian_sold                    # ручной
#   docker compose run --rm winners_sold                 # ручной
#   docker compose run --rm domclick_sold                # ручной
#   docker compose run --rm flatinfo_houses              # ручной
#   docker compose run --rm pipeline_runner              # ручной запуск pipeline
#
# Dev-режим для API (uvicorn --reload, монтирование исходников):
#   docker compose --profile dev up -d api
#   # web/next при этом запускается локально: cd web/next && npm run dev

x-strip-proxy-env: &strip-proxy-env
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  ALL_PROXY: ""
  all_proxy: ""

services:
  # ============================================================ Infrastructure

  app_postgres:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flipper
      POSTGRES_USER: flipper
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-flipper_secret}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - flipper_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipper"]
      interval: 10s
      timeout: 5s
      retries: 5

  app_redis:
    image: redis:alpine
    container_name: app_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - flipper_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  html_to_markdown:
    image: flipper-html_to_markdown
    build:
      context: ./packages/go-html-to-md
      dockerfile: Dockerfile
    container_name: html_to_markdown
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - PORT=8080
      - ENV=production
      - TZ=Europe/Moscow
    networks:
      - flipper_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  cookie_manager:
    image: flipper-cookie_manager
    build:
      context: ./services/cookie_manager
      dockerfile: Dockerfile
    container_name: cookie_manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ${FLIPPER_COOKIES_SOURCE:-./services/cookie_manager/cookies.json}:/app/cookies.json
      - ${FLIPPER_ACCOUNTS_SOURCE:-./services/cookie_manager/accounts.json}:/app/accounts.json
      - ${FLIPPER_DATA_SOURCE:-./data}:/app/data:ro
    depends_on:
      - app_redis
    networks:
      - flipper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ============================================================ Parsers (manual)

  cian_active:
    image: flipper-cian_active
    build:
      context: .
      dockerfile: ./services/parsers/cian_active/Dockerfile
    container_name: cian_active
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Moscow
      <<: *strip-proxy-env
      FIRECRAWL_BASE_URL: "${PARSER_FIRECRAWL_BASE_URL:-http://host.docker.internal:3002}"
    volumes:
      - ${FLIPPER_CREDENTIALS_SOURCE:-./credentials.json}:/app/credentials.json
      - ${FLIPPER_DATA_SOURCE:-./data}:/app/data
    depends_on:
      cookie_manager:
        condition: service_healthy
      html_to_markdown:
        condition: service_healthy
      app_postgres:
        condition: service_healthy
    networks:
      - flipper_network
      - firecrawl_backend
    profiles:
      - manual

  cian_sold:
    image: flipper-cian_sold
    build:
      context: .
      dockerfile: ./services/parsers/cian_sold/Dockerfile
    container_name: cian_sold
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      <<: *strip-proxy-env
    volumes:
      - ${FLIPPER_DATA_SOURCE:-./data}:/app/data
    depends_on:
      app_postgres:
        condition: service_healthy
    networks:
      - flipper_network
    profiles:
      - manual

  winners_sold:
    image: flipper-winners_sold
    build:
      context: .
      dockerfile: ./services/parsers/winners_sold/Dockerfile
    container_name: winners_sold
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      <<: *strip-proxy-env
    volumes:
      - ${FLIPPER_DATA_SOURCE:-./data}:/app/data
    depends_on:
      app_postgres:
        condition: service_healthy
    networks:
      - flipper_network
    profiles:
      - manual

  domclick_sold:
    image: flipper-domclick_sold
    build:
      context: .
      dockerfile: ./services/parsers/domclick_sold/Dockerfile
    container_name: domclick_sold
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      <<: *strip-proxy-env
    volumes:
      - ${FLIPPER_DATA_SOURCE:-./data}:/app/data
    depends_on:
      app_postgres:
        condition: service_healthy
    networks:
      - flipper_network
    profiles:
      - manual

  flatinfo_houses:
    image: flipper-flatinfo_houses
    build:
      context: .
      dockerfile: ./services/parsers/flatinfo_houses/Dockerfile
    container_name: flatinfo_houses
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      <<: *strip-proxy-env
    volumes:
      - ${FLIPPER_DATA_SOURCE:-./data}:/app/data
    depends_on:
      app_postgres:
        condition: service_healthy
    networks:
      - flipper_network
    profiles:
      - manual

  category_counter:
    image: flipper-category_counter
    build:
      context: .
      dockerfile: ./services/category_counter/Dockerfile
    container_name: category_counter
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app
      <<: *strip-proxy-env
    volumes:
      - ${FLIPPER_CREDENTIALS_SOURCE:-./credentials.json}:/app/credentials.json
      - ${FLIPPER_DATA_SOURCE:-./data}:/app/data
    depends_on:
      html_to_markdown:
        condition: service_healthy
    networks:
      - flipper_network
    profiles:
      - manual

  # Pipeline runner: ежедневный "fetch-missing" всех активных объявлений
  # cian_active. Запускается scheduler'ом через `docker compose run --rm pipeline_runner`
  # в 02:00 MSK. По сути — обёртка вокруг scripts/run_pipeline.py.
  pipeline_runner:
    image: flipper-pipeline_runner
    build:
      context: .
      dockerfile: ./services/pipeline_runner/Dockerfile
    container_name: pipeline_runner
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app
      <<: *strip-proxy-env
      FIRECRAWL_BASE_URL: "${PARSER_FIRECRAWL_BASE_URL:-http://host.docker.internal:3002}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${FLIPPER_DATA_SOURCE:-./data}:/app/data
    depends_on:
      app_postgres:
        condition: service_healthy
    networks:
      - flipper_network
    profiles:
      - manual

  # ============================================================ Always-on

  # FastAPI backend (web/server.py).
  #
  # Прод-режим по умолчанию: gunicorn + uvicorn workers, без --reload.
  # Для dev-режима с hot-reload: `docker compose --profile dev up -d api`
  # (использует services/api/Dockerfile.dev с volume-монтированием).
  #
  # DATABASE_URL берётся из .env (единый для всех сервисов → app_postgres:5432).
  api:
    image: flipper-api
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
    container_name: flipper_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app
    ports:
      - "8001:8000"   # host 8001 → container 8000 (host 8000 занят cookie_manager)
    depends_on:
      app_postgres:
        condition: service_healthy
    networks:
      - flipper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Dev-вариант api: uvicorn --reload + volume-монтирование исходников.
  # Поднимается отдельно через `--profile dev`, чтобы не мешать прод-стэку.
  api-dev:
    image: flipper-api
    build:
      context: .
      dockerfile: ./services/api/Dockerfile.dev
    container_name: flipper_api_dev
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app
    ports:
      - "8001:8000"
    depends_on:
      app_postgres:
        condition: service_healthy
    volumes:
      # Live code — uvicorn --reload увидит правки мгновенно.
      - ./web:/app/web
      - ./packages:/app/packages
      - ./services:/app/services
    networks:
      - flipper_network
    profiles:
      - dev

  scheduler:
    image: flipper-scheduler
    build:
      context: .
      dockerfile: ./services/scheduler/Dockerfile
    container_name: flipper_scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Moscow
      <<: *strip-proxy-env
      SCHEDULER_CONTAINER_NAME: flipper_scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
      - ./data:/app/data
    depends_on:
      cookie_manager:
        condition: service_healthy
      html_to_markdown:
        condition: service_healthy
      app_postgres:
        condition: service_healthy
    networks:
      - flipper_network

networks:
  flipper_network:
    driver: bridge
  firecrawl_backend:
    external: true

volumes:
  pgdata:
